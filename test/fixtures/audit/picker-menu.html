<!doctype html><meta charset="utf-8"><title>An open Spectrum picker</title>
<style>
  body { margin: 0; font: 14px system-ui; background: #fff; color: #111; }
  sp-overlay { position: fixed; inset: 0; display: block; background: rgba(0,0,0,.35); }
  sp-popover { position: fixed; left: 16px; right: 16px; top: 48px; bottom: 48px; display: block; background: #fff; padding: 12px; }
  button { height: 36px; min-width: 88px; }
</style>
<button style="margin: 12px">Content type</button>
<sp-overlay open role="dialog" aria-modal="true" aria-label="Content type">
  <sp-popover>
    <sp-menu role="listbox">
      <sp-menu-item role="option"><button>Website</button></sp-menu-item>
      <sp-menu-item role="option"><button>Poster</button></sp-menu-item>
    </sp-menu>
  </sp-popover>
</sp-overlay>
